# Publishes n8n-nodes-sigmora to npm with a provenance statement.
#
# This file is the `n8n-node release --init-workflow` shape. It is inert in the
# Sigmora monorepo (GitHub only runs workflows under the repository root's
# .github/workflows) and becomes active in the public mirror
# https://github.com/mlsniperpro/n8n-nodes-sigmora, which the monorepo's
# mirror-n8n.yml fills with `git subtree split --prefix integrations/n8n`.
# npm refuses provenance from a private source repository, and n8n requires
# provenance for verified community nodes, so publishing happens only there.
#
# One-time setup in the public mirror:
#   Option A (preferred): npm trusted publisher with repository owner
#     `mlsniperpro`, repository `n8n-nodes-sigmora`, workflow `publish.yml`,
#     and no NPM_TOKEN secret.
#   Option B (first publish of the unclaimed name, or fallback): a granular npm
#     token scoped to n8n-nodes-sigmora, stored as the mirror's NPM_TOKEN secret.
#
# Release: push a tag `n8n-v<package.json version>` (e.g. n8n-v0.1.0) to the
# mirror. The tag must match the package version or the job refuses to publish.

name: Publish

on:
  push:
    tags:
      - "n8n-v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish n8n-nodes-sigmora to npm
    # npm provenance claims the job's GitHub OIDC identity, so this stays on a
    # GitHub-hosted runner in the public mirror.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to mint the OIDC token for the npm provenance attestation.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No registry-url: setup-node would write an empty NODE_AUTH_TOKEN
          # line that shadows the trusted-publisher OIDC exchange.
          node-version: 24

      - name: Bind the release tag to the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const expectedTag = `n8n-v${packageJson.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `release tag ${process.env.RELEASE_TAG} does not match expected package tag ${expectedTag}`,
            );
          }
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Release
        # `n8n-node release` in CI runs lint and build, then `npm publish` with
        # NPM_CONFIG_PROVENANCE=true. With a trusted publisher NPM_TOKEN stays
        # unset and npm uses the OIDC exchange instead.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
