# Publishes n8n-nodes-sigmora to npm with a provenance statement.
#
# This file does what `n8n-node release` does in CI (lint, build, then
# `npm publish` with provenance), split so publish credentials never meet
# dependency code. It is inert in the Sigmora monorepo (GitHub only runs
# workflows under the repository root's .github/workflows) and becomes active
# in the public mirror https://github.com/mlsniperpro/n8n-nodes-sigmora, which
# the monorepo's mirror-n8n.yml fills with
# `git subtree split --prefix integrations/n8n`. npm refuses provenance from a
# private source repository, and n8n requires provenance for verified community
# nodes, so publishing happens only there.
#
# Supply chain: the `build` job installs from the committed package-lock.json
# with `npm ci --ignore-scripts`, then lints, builds and packs with read-only
# permissions and no secret. The `publish` job alone holds `id-token: write`;
# it installs nothing, runs no package script, and writes the npm token (when
# one is set) only in its final step, which publishes the packed tarball.
#
# One-time setup in the public mirror:
#   Option A (preferred): npm trusted publisher with repository owner
#     `mlsniperpro`, repository `n8n-nodes-sigmora`, workflow `publish.yml`,
#     and no NPM_TOKEN secret.
#   Option B (first publish of the unclaimed name, or fallback): a granular npm
#     token scoped to n8n-nodes-sigmora, stored as the mirror's NPM_TOKEN secret.
#
# Release: push a tag `n8n-v<package.json version>` (e.g. n8n-v0.1.0) to the
# mirror. The tag must match the package version or the job refuses to publish.

name: Publish

on:
  push:
    tags:
      - "n8n-v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, build and pack n8n-nodes-sigmora
    # npm provenance claims the publish job's GitHub OIDC identity, so the
    # release stays on GitHub-hosted runners in the public mirror.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Bind the release tag to the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const expectedTag = `n8n-v${packageJson.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `release tag ${process.env.RELEASE_TAG} does not match expected package tag ${expectedTag}`,
            );
          }
          NODE

      - name: Install the locked dependencies
        # npm ci refuses a lockfile that disagrees with package.json, and
        # --ignore-scripts keeps dependency lifecycle scripts from running.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish n8n-nodes-sigmora to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required to mint the OIDC token for the npm provenance attestation
      # (and the trusted-publisher exchange).
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # No registry-url: setup-node would write an empty NODE_AUTH_TOKEN
          # line that shadows the trusted-publisher OIDC exchange.
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Publish
        # With a trusted publisher NPM_TOKEN stays unset and npm uses the OIDC
        # exchange instead. The tarball is published as packed; no package
        # script runs here.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/package/*.tgz)"
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish "$tarball" --provenance --access public --ignore-scripts
